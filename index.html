<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSCode - Python QR Execution</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #canvasQr { display: block; background: #ffffff; padding: 20px; border-radius: 4px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <canvas id="canvasQr" width="260" height="260"></canvas>

    <script>
        var CHAVE_PIX   = "3d4ee862-439d-481d-9f5b-07d69a7182f6";
        var NOME_LOJA   = "JOSE CARLOS SUGUIMOTO";
        var CIDADE_LOJA = "MAIRIPORA";

        function montarPixUniversal(chave, nome, cidade) {
            var chLimpa = chave.trim();
            var nomeLimpo = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().substring(0, 25);
            var cidadeLimpa = cidade.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().substring(0, 15);
            
            var gui = "0014br.gov.bcb.pix";
            var campoChave = "01" + String(chLimpa.length).padStart(2, '0') + chLimpa;
            var conteudo26 = gui + campoChave;
            
            var bloco26 = "26" + String(conteudo26.length).padStart(2, '0') + conteudo26;
            var bloco52 = "52040000";
            var bloco53 = "5303986";
            var bloco58 = "5802BR";
            var bloco59 = "59" + String(nomeLimpo.length).padStart(2, '0') + nomeLimpo;
            var bloco60 = "60" + String(cidadeLimpa.length).padStart(2, '0') + cidadeLimpa;
            var bloco62 = "62070503***";
            
            var payloadSemCrc = "000201" + bloco26 + bloco52 + bloco53 + bloco58 + bloco59 + bloco60 + bloco62 + "6304";
            
            var crc = 0xFFFF;
            for (var c = 0; c < payloadSemCrc.length; c++) {
                crc ^= payloadSemCrc.charCodeAt(c) << 8;
                for (var i = 0; i < 8; i++) {
                    if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            return payloadSemCrc + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }
        // Motor Matemático ISO/IEC Minimalista Blindado para Pix
        var GeradorQR = function() {
            function q(t, e) { this.v = t; this.e = e; this.m = null; this.c = 0; this.d = []; }
            q.prototype = {
                add: function(d) { this.d.push(new function(s) { this.mode = 4; this.data = s; }(d)); },
                make: function() {
                    this.c = 4 * this.v + 17; this.m = Array(this.c).fill(0).map(() => Array(this.c).fill(null));
                    this.p(0, 0); this.p(this.c - 7, 0); this.p(0, this.c - 7); this.t(); this.info();
                    var b = new function() { this.b = []; this.l = 0; }( );
                    b.put = function(v, l) { for (var i = 0; i < l; i++) this.bit(1 == (v >>> l - 1 - i & 1)); };
                    b.bit = function(t) { var e = Math.floor(this.l / 8); this.b.length <= e && this.b.push(0); t && (this.b[e] |= 128 >>> this.l % 8); this.l++; };
                    for (var s of this.d) { b.put(4, 4); b.put(s.data.length, this.v < 10 ? 8 : 16); for (var i = 0; i < s.data.length; i++) b.put(s.data.charCodeAt(i), 8); }
                    var totalData = [192, 172, 230, 288, 336, 392, 480, 528, 600, 656][this.v - 1] || 288;
                    b.put(0, 4); while (b.l % 8 != 0) b.bit(!1);
                    while (b.l < totalData) { b.put(236, 8); if (b.l >= totalData) break; b.put(17, 8); }
                    this.map(b.b);
                },
                p: function(r, c) { for (var i = -1; i <= 7; i++) for (var j = -1; j <= 7; j++) if (!(r + i < 0 || this.c <= r + i || c + j < 0 || this.c <= c + j)) this.m[r + i][c + j] = 0 <= i && i <= 6 && (0 == i || 6 == i) || 0 <= j && j <= 6 && (0 == j || 6 == j) || 2 <= i && i <= 4 && 2 <= j && j <= 4; },
                t: function() { for (var i = 8; i < this.c - 8; i++) this.m[i][6] = this.m[6][i] = 0 == i % 2; },
                info: function() { var v = [31892, 34236, 39577, 42195, 48118, 51042, 55361, 57677, 62666, 65244][this.v - 1] || 42195; for (var i = 0; i < 15; i++) { var bit = 1 == (v >>> i & 1); i < 6 ? this.m[i][8] = bit : i < 8 ? this.m[i + 1][8] = bit : this.m[this.c - 15 + i][8] = bit; i < 8 ? this.m[8][this.c - i - 1] = bit : i < 9 ? this.m[8][15 - i] = bit : this.m[8][15 - i - 1] = bit; } this.m[this.c - 8][8] = !0; },
                map: function(bytes) { var bitIdx = 0, inc = -1, row = this.c - 1, bit = 7; for (var col = this.c - 1; col > 0; col -= 2) { if (6 == col) col--; for (; ;) { for (var c = 0; c < 2; c++) if (null == this.m[row][col - c]) { var dark = !1; bitIdx < bytes.length && (dark = 1 == (bytes[bitIdx] >>> bit & 1)); ((row + col - c) % 2 == 0) && (dark = !dark); this.m[row][col - c] = dark; bit--; if (-1 == bit) { bitIdx++; bit = 7; } } row += inc; if (row < 0 || this.c <= row) { row -= inc; inc = -inc; break; } } } }
            };
            return q;
        }();

        // Renderização Cirúrgica do Canvas VSCode
        function desenharVisualizadorVSCode(texto) {
            try {
                var canvas = document.getElementById("canvasQr");
                var ctx = canvas.getContext("2d");
                
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, 260, 260);
                
                // Versão 8 ideal para strings estáveis de Pix de 166 caracteres
                var qr = new GeradorQR(8, 1);
                qr.add(texto);
                qr.make();
                
                var modCount = qr.c;
                var modSize = 4;
                var margem = Math.floor((260 - (modSize * modCount)) / 2);
                
                ctx.fillStyle = "#000000";
                for (var r = 0; r < modCount; r++) {
                    for (var c = 0; c < modCount; c++) {
                        if (qr.m[r][c]) {
                            ctx.fillRect(margem + (c * modSize), margem + (r * modSize), modSize, modSize);
                        }
                    }
                }
                console.log("Execução VSCode Concluída: Código QR Puro Ativo!");
            } catch (e) {
                console.error("Erro na execução do script:", e);
            }
        }

        window.onload = function() {
            var codigoPix = montarPixUniversal(CHAVE_PIX, NOME_LOJA, CIDADE_LOJA);
            desenharVisualizadorVSCode(codigoPix);
        };
    </script>
</body>
</html>
