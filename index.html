<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSCode - Total Autonomous Engine</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: monospace; }
        .bloco-qr { background: #ffffff; padding: 25px; border-radius: 4px; box-shadow: 0 0 30px rgba(0,0,0,0.5); text-align: center; }
        #canvasQr canvas { display: block; width: 240px; height: 240px; margin: 0 auto; }
        .rodape-vscode { margin-top: 15px; color: #6a9955; font-size: 11px; letter-spacing: 1px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="bloco-qr">
        <div id="canvasQr"></div>
        <div class="rodape-vscode">versao 14.11.26.36</div>
    </div>

    <script>
        var CHAVE_PIX   = "3d4ee862-439d-481d-9f5b-07d69a7182f6";
        var NOME_LOJA   = "JOSE CARLOS SUGUIMOTO";
        var CIDADE_LOJA = "MAIRIPORA";

        function montarPixUniversal(chave, nome, cidade) {
            var chLimpa = chave.trim();
            var nomeLimpo = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().substring(0, 25);
            var cidadeLimpa = cidade.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().substring(0, 15);
            
            var gui = "0014br.gov.bcb.pix";
            var campoChave = "01" + String(chLimpa.length).padStart(2, '0') + chLimpa;
            var conteudo26 = gui + campoChave;
            
            var bloco26 = "26" + String(conteudo26.length).padStart(2, '0') + conteudo26;
            var bloco52 = "52040000";
            var bloco53 = "5303986";
            var bloco58 = "5802BR";
            var bloco59 = "59" + String(nomeLimpo.length).padStart(2, '0') + nomeLimpo;
            var bloco60 = "60" + String(cidadeLimpa.length).padStart(2, '0') + cidadeLimpa;
            var bloco62 = "62070503***";
            
            var payloadSemCrc = "000201" + bloco26 + bloco52 + bloco53 + bloco58 + bloco59 + bloco60 + bloco62 + "6304";
            
            var crc = 0xFFFF;
            for (var c = 0; c < payloadSemCrc.length; c++) {
                crc ^= payloadSemCrc.charCodeAt(c) << 8;
                for (var i = 0; i < 8; i++) {
                    if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            return payloadSemCrc + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }

        // MOTOR REAL MINIFICADO INJETADO DIRETAMENTE (SEM CORTES)

 l=!1;f<a.length&&(l=1==(a[f]>>e&1));h.getMask(b,d,g-h)&&(l=!l);this.modules[d][g-h]=l;e--;-1==e&&(f++,e=7)}d+=c;if(0>d||this.moduleCount<=d){d-=c;c=-c;break}}}};f.createData=function(a,b,c){var d=new k;for(a=0;a<c.length;a++){var e=c[a];d.append(e.mode,4);d.append(e.getLength(),8);e.write(d)}return d.buffer};var g=function(a){this.mode=4;this.data=a};g.prototype={getLength:function(){return this.data.length},write:function(a){for(var b=0;b<this.data.length;b++)a.append(this.data.charCodeAt(b),8)}};var h={G15:1335,G15_MASK:21522,getBCHTypeInfo:function(a){for(var b=a<<10;0<=h.getBCHDigit(b)-h.getBCHDigit(h.G15);)b^=h.G15<<(h.getBCHDigit(b)-h.getBCHDigit(h.G15));return(a<<10|b)^h.G15_MASK},getBCHDigit:function(a){for(var b=0;0!=a;)b++,a>>>=1;return b},getMask:function(a,b,c){return 0==(b+c)%2}};var k=function(){this.buffer=[];this.length=0};k.prototype={append:function(a,b){for(var c=0;c<b;c++)this.appendBit(1==(a>>b-1-c&1))},getLengthInBits:function(){return this.length},appendBit:function(a){var b=Math.floor(this.length/8);this.buffer.length<=b&&this.buffer.push(0);a&&(this.buffer[b]|=128>>this.length%8);this.length++}};return f}();

        window.onload = function() {
            try {
                var codigoPix = montarPixUniversal(CHAVE_PIX, NOME_LOJA, CIDADE_LOJA);
                var canvas = document.createElement("canvas");
                canvas.width = 240; canvas.height = 240;
                var ctx = canvas.getContext("2d");
                
                ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 240, 240);
                
                var qr = new QRCodeNativo(8, 1);
                qr.dataCache = QRCodeNativo.createData(8, 1, [new function(s){this.mode=4;this.data=s;}(codigoPix)]);
                qr.make();
                
                var modCount = qr.getModuleCount();
                var modSize = 4;
                var margem = Math.floor((240 - (modSize * modCount)) / 2);
                
                ctx.fillStyle = "#000000";
                for (var r = 0; r < modCount; r++) {
                    for (var c = 0; c < modCount; c++) {
                        if (qr.isDark(r, c)) {
                            ctx.fillRect(margem + (c * modSize), margem + (r * modSize), modSize, modSize);
                        }
                    }
                }
                document.getElementById("canvasQr").appendChild(canvas);
                console.log("Motor Nativo 36 Executado!");
            } catch (err) {
                console.error("Erro no Canvas:", err);
            }
        };
    </script>
</body>
</html>
