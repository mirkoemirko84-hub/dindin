<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de Pagamento Oficial BCB</title>
    <!-- Biblioteca QR Code oficial (ISO/IEC 18004) -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; padding: 20px; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; box-sizing: border-box; }
        .container-pix { background-color: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); max-width: 360px; width: 100%; text-align: center; box-sizing: border-box; }
        .indicador-tabular { font-size: 14px; font-weight: bold; color: #0d47a1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .txt-valor { font-size: 28px; font-weight: 900; color: #1e293b; margin: 10px 0; }
        .txt-destino { font-size: 12px; color: #64748b; margin-bottom: 5px; font-weight: 600; }
        .badge-tipo { display: inline-block; background: #e0f2fe; color: #0369a1; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 12px; margin-bottom: 10px; }
        .bloco-qrcode-real { display: flex; justify-content: center; align-items: center; background: #ffffff; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; width: 240px; height: 240px; margin: 15px auto; box-sizing: border-box; }
        .bloco-qrcode-real canvas { width: 205px !important; height: 205px !important; }
        .btn-copiar { margin-top: 10px; padding: 14px 20px; font-size: 12px; font-weight: bold; background-color: #0d47a1; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; width: 100%; }
        .btn-voltar { margin-top: 10px; padding: 14px 20px; font-size: 12px; font-weight: bold; background-color: #cc092f; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; width: 100%; }
        .rodape-software { margin-top: 25px; font-size: 10px; color: #94a3b8; font-family: monospace; text-align: center; }
    </style>
</head>
<body>
    <div class="container-pix">
        <div class="indicador-tabular">Aponte a Câmera do Banco ⬇️</div>
        <div class="txt-valor" id="view-valor">R$ 0,25</div>
        <div class="txt-destino" id="view-destino">Destino: MAIRIPORA AGRO</div>
        <div class="badge-tipo" id="view-tipo">CHAVE: ALEATÓRIA</div>
        
        <div class="bloco-qrcode-real">
            <canvas id="canvasQr"></canvas>
        </div>

        <button class="btn-copiar" onclick="copiarPix()">📋 Copiar Código Pix</button>
        <button class="btn-voltar" onclick="window.location.href='index.html'">⬅️ Nova Cobrança</button>
        <div class="rodape-software">JCS_software . versao 12.11.26.02</div>
    </div>

    <script>
        var codigoPixGerado = "";

        // =========================================================================
        // CONFIGURAÇÃO DO CLIENTE (ATIVE APENAS 1 OPÇÃO REMOVENDO AS CERQUINHAS ###)
        // =========================================================================

               // --- OPÇÃO 1: CHAVE ALEATÓRIA (ATIVA NO MOMENTO) ---
        var TIPO_CHAVE  = "CHAVE ALEATÓRIA";
        var CHAVE_PIX   = "3d4ee862-439d-481d-9f5b-07d69a7182f6";
        var NOME_LOJA   = "JOSE CARLOS SUGUIMOTO";       // Máx 25 letras, SEM ACENTOS
        var CIDADE_LOJA = "MAIRIPORA";                   // Máx 15 letras, SEM ACENTOS


        // --- OPÇÃO 2: CHAVE CPF (ISOLADA COM CERQUINHA ###) ---
        // ### var TIPO_CHAVE  = "CHAVE CPF";
        // ### var CHAVE_PIX   = "00000000000";          // Apenas os 11 números (sem pontos ou traço)
        // ### var NOME_LOJA   = "NOME DO RECEBEDOR";
        // ### var CIDADE_LOJA = "MAIRIPORA";

        // --- OPÇÃO 3: CHAVE CNPJ (ISOLADA COM CERQUINHA ###) ---
        // ### var TIPO_CHAVE  = "CHAVE CNPJ";
        // ### var CHAVE_PIX   = "00000000000000";       // Apenas os 14 números (sem pontos, barra ou traço)
        // ### var NOME_LOJA   = "NOME DA EMPRESA";
        // ### var CIDADE_LOJA = "MAIRIPORA";

        // --- OPÇÃO 4: CHAVE E-MAIL (ISOLADA COM CERQUINHA ###) ---
        // ### var TIPO_CHAVE  = "CHAVE E-MAIL";
        // ### var CHAVE_PIX   = "contato@exemplo.com.br"; // Tudo em minúsculo
        // ### var NOME_LOJA   = "NOME DO RECEBEDOR";
        // ### var CIDADE_LOJA = "MAIRIPORA";

        // =========================================================================
        // MOTOR OFICIAL PIX BCB (EMV / BR CODE + CRC16)
        // =========================================================================
        function montarPayloadPix(chave, nome, cidade, valorFloat, txid) {
            var chLimpa = chave.trim();
            var nomeLimpo = nome.toUpperCase().substring(0, 25);
            var cidadeLimpa = cidade.toUpperCase().substring(0, 15);
            var valorStr = parseFloat(valorFloat).toFixed(2);
            var txIdLimpo = txid ? txid.replace(/[^a-zA-Z0-9]/g, '').substring(0, 25) : "***";

            // Campo 26: Conta Pix (GUI + Chave)
            var gui = "0014br.gov.bcb.pix";
            var campoChave = "01" + String(chLimpa.length).padStart(2, '0') + chLimpa;
            var conteudo26 = gui + campoChave;
            var bloco26 = "26" + String(conteudo26.length).padStart(2, '0') + conteudo26;

            // Campo 54: Valor
            var bloco54 = "54" + String(valorStr.length).padStart(2, '0') + valorStr;

            // Campo 59: Nome do Recebedor
            var bloco59 = "59" + String(nomeLimpo.length).padStart(2, '0') + nomeLimpo;

            // Campo 60: Cidade
            var bloco60 = "60" + String(cidadeLimpa.length).padStart(2, '0') + cidadeLimpa;

            // Campo 62: TxID
            var sub05 = "05" + String(txIdLimpo.length).padStart(2, '0') + txIdLimpo;
            var bloco62 = "62" + String(sub05.length).padStart(2, '0') + sub05;

            // Montagem sem CRC
            var payloadSemCrc = "000201" + bloco26 + "52040000" + "5303986" + bloco54 + "5802BR" + bloco59 + bloco60 + bloco62 + "6304";

            // Cálculo matemático CRC16-CCITT (0xFFFF)
            var crc = 0xFFFF;
            for (var c = 0; c < payloadSemCrc.length; c++) {
                crc ^= payloadSemCrc.charCodeAt(c) << 8;
                for (var i = 0; i < 8; i++) {
                    if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            var crcHex = (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
            return payloadSemCrc + crcHex;
        }

        function copiarPix() {
            if (!codigoPixGerado) return;
            navigator.clipboard.writeText(codigoPixGerado).then(function() {
                alert("Código Pix Copia e Cola copiado com sucesso!");
            });
        }

        window.onload = function() {
            var params = new URLSearchParams(window.location.search);
            // Se vier valor na URL (?v=0.25), usa ele; senão usa 0.25 como padrão de teste
            var vf = params.get('v') ? parseFloat(params.get('v')) : 0.25;
            var tx = params.get('tx') ? params.get('tx') : "JCS001";

            document.getElementById("view-valor").innerText = "R$ " + vf.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById("view-tipo").innerText = TIPO_CHAVE;

            codigoPixGerado = montarPayloadPix(CHAVE_PIX, NOME_LOJA, CIDADE_LOJA, vf, tx);

            // Desenha o QR Code oficial no canvas
            QRCode.toCanvas(document.getElementById("canvasQr"), codigoPixGerado, {
                width: 205,
                margin: 1,
                errorCorrectionLevel: 'M'
            }, function (error) {
                if (error) console.error(error);
            });
        };
    </script>
</body>
</html>
