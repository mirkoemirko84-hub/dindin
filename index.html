        body { margin: 0; padding: 20px; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; box-sizing: border-box; }
        .container-pix { background-color: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); max-width: 360px; width: 100%; text-align: center; box-sizing: border-box; }
        .indicador-tabular { font-size: 14px; font-weight: bold; color: #0d47a1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .txt-valor { font-size: 28px; font-weight: 900; color: #1e293b; margin: 10px 0; }
        .txt-destino { font-size: 12px; color: #64748b; margin-bottom: 15px; font-weight: 600; }
        
        /* Moldura branca limpa para a câmera ler sem reflexo */
        .bloco-qrcode-real { display: flex; justify-content: center; align-items: center; background: #ffffff; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; width: 240px; height: 240px; margin: 20px auto; box-sizing: border-box; }
        .bloco-qrcode-real img, .bloco-qrcode-real canvas { width: 200px !important; height: 200px !important; }
        
        .btn-gerar { margin-top: 10px; padding: 14px 28px; font-size: 13px; font-weight: bold; background-color: #16a34a; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; width: 100%; }
        .btn-voltar { margin-top: 12px; padding: 14px 28px; font-size: 12px; font-weight: bold; background-color: #cc092f; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; width: 100%; }
        .rodape-software { margin-top: 25px; font-size: 10px; color: #94a3b8; font-family: monospace; text-align: center; }

        <div class="indicador-tabular">Teste de Leitura QR Code ⬇️</div>
        <div class="txt-valor" id="view-valor">MODO TESTE</div>
        <div class="txt-destino">Destino: MAIRIPORA AGRO</div>
        
        <!-- Onde o QR Code real vai aparecer -->
        <div class="bloco-qrcode-real" id="qrcode"></div>

        <button class="btn-gerar" onclick="gerarQrAleatorio()">🔄 Gerar Novo QR Aleatório</button>
        <button class="btn-voltar" onclick="window.location.href='index.html'">⬅️ Nova Cobrança</button>

        // =========================================================================
        // 1. MODO ATIVO: GERADOR DE QR CODE ALEATÓRIO REAL (PARA TESTE DE CÂMERA)
        // =========================================================================
        function gerarQrAleatorio() {
            var containerQr = document.getElementById("qrcode");
            containerQr.innerHTML = ""; // Limpa o QR anterior

            // Gera um código aleatório único a cada clique
            var codigoAleatorio = "MAIRIPORA-AGRO-TESTE-" + Math.floor(100000 + Math.random() * 900000);

            // Desenha o QR Code oficial padrão ISO (legível por qualquer câmera)
            new QRCode(containerQr, {
                text: codigoAleatorio,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
        }

        // Dispara o primeiro QR Code assim que a tela abre
        window.onload = function() {
            gerarQrAleatorio();
        };
