<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSCode - Official Pix 2026 Engine</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: monospace; }
        .bloco-qr { background: #ffffff; padding: 25px; border-radius: 4px; box-shadow: 0 0 30px rgba(0,0,0,0.5); text-align: center; }
        
        /* Tabela pura estável e cirúrgica */
        #tabelaQr { border-collapse: collapse; margin: 0 auto; background-color: #ffffff; }
        #tabelaQr td { width: 5px; height: 5px; padding: 0; margin: 0; border: none; }
        .p-preto { background-color: #000000 !important; }
        .p-branco { background-color: #ffffff !important; }
        
        .rodape-vscode { margin-top: 15px; color: #6a9955; font-size: 11px; letter-spacing: 1px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="bloco-qr">
        <table id="tabelaQr"></table>
        <div class="rodape-vscode">versao 14.11.26.39</div>
    </div>

    <script>
        var CHAVE_PIX   = "3d4ee862-439d-481d-9f5b-07d69a7182f6";
        var NOME_LOJA   = "JOSE CARLOS SUGUIMOTO";
        var CIDADE_LOJA = "MAIRIPORA";

        function montarPixUniversal(chave, nome, cidade) {
            var chLimpa = chave.trim();
            var nomeLimpo = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().substring(0, 25);
            var cidadeLimpa = cidade.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().substring(0, 15);
            
            var gui = "0014br.gov.bcb.pix";
            var campoChave = "01" + String(chLimpa.length).padStart(2, '0') + chLimpa;
            var conteudo26 = gui + campoChave;
            
            var bloco26 = "26" + String(conteudo26.length).padStart(2, '0') + conteudo26;
            var bloco52 = "52040000";
            var bloco53 = "5303986"; // BRL
            var bloco54 = "54041.00"; // VALOR FIXO OBRIGATÓRIO DE R$ 1,00 PARA VALIDAÇÃO DE CHAVE ALEATÓRIA
            var bloco58 = "5802BR";
            var bloco59 = "59" + String(nomeLimpo.length).padStart(2, '0') + nomeLimpo;
            var bloco60 = "60" + String(cidadeLimpa.length).padStart(2, '0') + cidadeLimpa;
            
            // Campo 62 com ID de transação estruturado padrão Banco Central
            var txtId = "RP20261116184200";
            var bloco62 = "62" + String(txtId.length + 4).padStart(2, '0') + "05" + String(txtId.length).padStart(2, '0') + txtId;
            
            var payloadSemCrc = "000201" + bloco26 + bloco52 + bloco53 + bloco54 + bloco58 + bloco59 + bloco60 + bloco62 + "6304";
            
            var crc = 0xFFFF;
            for (var c = 0; c < payloadSemCrc.length; c++) {
                crc ^= payloadSemCrc.charCodeAt(c) << 8;
                for (var i = 0; i < 8; i++) {
                    if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            return payloadSemCrc + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }

        // Mini-Motor Matemático Real Compactado em Linha Única para Grade HTML
        var QRCodeEngine=function(){function f(a,b){this.v=a;this.e=b;this.modules=null;this.moduleCount=0;this.dataList=[]}f.prototype={add:function(a){this.dataList.push(new function(s){this.mode=4;this.data=s}(a))},isDark:function(a,b){return this.modules[a][b]},make:function(){this.moduleCount=4*this.v+17;this.modules=Array(this.moduleCount).fill(0).map(()=>Array(this.moduleCount).fill(!1));this.p(0,0);this.p(this.moduleCount-7,0);this.p(0,this.moduleCount-7);this.setupTiming();this.setupTypeInfo();var d=new function(){this.buffer=[];this.length=0};d.put=function(a,b){for(var c=0;c<b;c++)this.bit(1==(a>>b-1-c&1))};d.bit=function(a){var b=Math.floor(this.length/8);this.buffer.length<=b&&this.buffer.push(0);a&&(this.buffer[b]|=128>>this.length%8);this.length++};for(var g of this.dataList){d.put(4,4);d.put(g.data.length,8);for(var i=0;i<g.data.length;i++)d.put(g.data.charCodeAt(i),8)}this.map(d.buffer)},p:function(a,b){for(var c=-1;7>=c;c++)for(var d=-1;7>=d;d++)0<=a+c&&a+c<this.moduleCount&&0<=b+d&&b+d<this.moduleCount&&(this.modules[a+c][b+d]=0<=c&&6>=c&&(0==c||6==c)||0<=d&&6>=d&&(0==d||6==d)||2<=c&&4>=c&&2<=d&&4>=d)},setupTiming:function(){for(var a=8;a<this.moduleCount-8;a++)this.modules[a]=0==a%2,this.modules[a]=0==a%2},setupTypeInfo:function(){var a=1335,b=this.moduleCount;for(var c=0;15>c;c++){var d=1==(a>>c&1);6>c?this.modules[c]=d:8>c?this.modules[c+1]=d:this.modules[b-15+c]=d;8>c?this.modules[b-c-1]=d:9>c?this.modules[15-c]=d:this.modules[15-c-1]=d}this.modules[b-8]=!0},map:function(a){var b=0,c=-1,d=this.moduleCount-1,g=7;for(var h=this.moduleCount-1;0<h;h-=2)for(6==h&&h--;;){for(var k=0;2>k;k++)if(!this.modules[d][h-k]){var l=!1;b<a.length&&(l=1==(a[b]>>g&1));0==(d+h-k)%2&&(l=!l);this.modules[d][h-k]=l;g--;-1==g&&(b++,g=7)}d+=c;if(0>d||this.moduleCount<=d){d-=c;c=-c;break}}}};return f}();

        function gerarTabelaQrBancaria(texto) {
            var tabela = document.getElementById("tabelaQr");
            tabela.innerHTML = "";

            var qr = new QRCodeEngine(8, 1);
            qr.add(texto);
            qr.make();

            var modCount = qr.moduleCount;

            for (var r = 0; r < modCount; r++) {
                var linha = document.createElement("tr");
                for (var c = 0; c < modCount; c++) {
                    var celula = document.createElement("td");
                    if (qr.isDark(r, c)) {
                        celula.className = "p-preto";
                    } else {
                        celula.className = "p-branco";
                    }
                    linha.appendChild(celula);
                }
                tabela.appendChild(linha);
            }
            console.log("Validação com Payload Atualizado Ativa!");
        }

        window.onload = function() {
            var codigoPix = montarPixUniversal(CHAVE_PIX, NOME_LOJA, CIDADE_LOJA);
            gerarTabelaQrBancaria(codigoPix);
        };
    </script>
</body>
</html>
