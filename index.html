<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Abertura | Mairiporã Agro</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; box-sizing: border-box; }
        .card-portal { background-color: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); max-width: 360px; width: 100%; text-align: center; box-sizing: border-box; border-top: 5px solid #0d47a1; }
        .logo-txt { font-size: 18px; font-weight: 800; color: #0d47a1; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-txt { font-size: 13px; color: #64748b; font-weight: 500; margin-bottom: 25px; }
        .btn-acesso { display: block; width: 100%; padding: 14px; font-size: 13px; font-weight: 700; background-color: #0d47a1; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; text-decoration: none; box-sizing: border-box; transition: background 0.2s; }
        .btn-acesso:hover { background-color: #0a3980; }
        .rodape { margin-top: 25px; font-size: 10px; color: #94a3b8; font-family: monospace; letter-spacing: 0.5px; }
    </style>
    <script>
        // Executa o redirecionamento automático instantâneo para o site da Maquininha
        window.location.href = "https://jcsuguimoto.com.br";
    </script>
</head>
<body>

    <div class="card-portal">
        <div class="logo-txt">Mairiporã Agro</div>
        <div class="status-txt">Conectando ao sistema de faturamento...</div>
        
        <!-- Botão reserva caso o redirecionamento automático falte -->
        <a href="https://jcsuguimoto.com.br" class="btn-acesso">Acessar Maquininha ➡️</a>
        
        <div class="rodape">JCS_software . versao 31.10.26.06</div>
    </div>

</body>
</html>
